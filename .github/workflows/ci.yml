name: CYBERANTE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build All Workspaces
        run: npm run build

      - name: Audit Production Bundle
        run: npm run verify:build

      - name: Run Test Suites
        run: npm test

      - name: Verify Complete Evaluator and Combat Coverage
        run: npm run test:math:coverage

      - name: Run Balance Simulator
        run: npm run sim

      - name: Install Browser Runtime
        run: npx playwright install --with-deps chromium

      - name: Verify Production Browser Flows
        run: npx playwright test
